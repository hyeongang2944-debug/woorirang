<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff0f3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="우리랑"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>우리랑 💗</title>
<style>
:root{--pink:#ff789b;--deep:#6e4554;--cream:#fffaf6;--soft:#ffe8ee;--mint:#e0f4e9;--line:#f4dbe2}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff2f5,#fffaf2 55%,#f4f8ff);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:var(--deep);padding-bottom:92px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:540px;margin:auto;min-height:100vh}.top{padding:22px 20px 14px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900;letter-spacing:-1px}.brand small{font-size:12px;display:block;font-weight:500;color:#ad8290;letter-spacing:0}.avatar{font-size:32px;background:#fff;border-radius:50%;padding:8px;box-shadow:0 5px 18px #e7bac633}.content{padding:0 16px}.hero{background:linear-gradient(135deg,#ffdce5,#fff0d7);border:1px solid #fff;border-radius:28px;padding:20px;position:relative;overflow:hidden;min-height:210px;box-shadow:0 8px 25px #e9c6ce33}.hero:after{content:'♡';position:absolute;font-size:115px;color:#fff8;right:8px;top:-12px}.eyebrow{font-size:12px;color:#a46d80;font-weight:700}.days{font-size:40px;font-weight:900;letter-spacing:-2px;margin:5px 0}.days span{font-size:17px;letter-spacing:0}.characters{font-size:55px;margin-top:0;position:absolute;right:20px;bottom:10px}.quote{font-size:13px;margin-top:12px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 12px;font-weight:900;font-size:17px}.card{background:#fffdfb;border:1px solid #fff;border-radius:20px;padding:15px;margin-bottom:10px;box-shadow:0 5px 18px #e7c6ce24}.muted{color:#b28c99;font-size:12px}.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.pill{border-radius:30px;background:#fff0f4;padding:8px 12px;color:#bd6783;font-size:12px;font-weight:700}.btn{background:var(--pink);color:white;border-radius:14px;padding:11px 14px;font-weight:800;box-shadow:0 4px 10px #ff789b33}.btn.light{background:#fff0f4;color:#ad617b;box-shadow:none}.btn.small{padding:8px 11px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.feature{background:#fff;border:1px solid white;border-radius:18px;padding:15px 12px;text-align:left;min-height:105px;color:var(--deep);box-shadow:0 5px 15px #e7c6ce20}.feature .emoji{font-size:27px;display:block;margin-bottom:8px}.feature b{font-size:14px}.feature span:last-child{display:block;font-size:11px;color:#b28c99;margin-top:4px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);padding:10px 7px calc(10px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(15px);display:flex;justify-content:space-around;border-top:1px solid #f6e2e7;z-index:5}.nav button{background:transparent;color:#b18b97;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 7px}.nav button .ni{font-size:21px}.nav button.active{color:#f36f94;font-weight:900}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fffafc;color:var(--deep);margin:6px 0 12px;outline-color:var(--pink)}label{font-size:12px;font-weight:800}.entry{display:flex;gap:12px}.entry img{width:100px;height:100px;object-fit:cover;border-radius:14px}.entry .placeholder{width:82px;height:82px;background:#fff0f4;border-radius:14px;display:grid;place-items:center;font-size:30px}.hide{display:none!important}.empty{text-align:center;padding:25px 12px;color:#b28c99;font-size:13px}.notice{background:#f0f6ff;border-radius:15px;padding:12px;font-size:12px;line-height:1.6;color:#7184a2}.mapbox{background:#edf4e8;border-radius:20px;min-height:170px;display:grid;place-items:center;text-align:center;padding:20px;font-size:13px;line-height:1.7}.footer{text-align:center;font-size:11px;color:#c3a0ab;padding:15px}
</style></head><body><div class="app"><header class="top"><div class="brand">우리랑 💗<small>우리의 작은 행복을 모으는 곳</small></div><div class="avatar">🐻‍❄️</div></header><main class="content" id="view"></main><nav class="nav"><button class="active" data-tab="home"><span class="ni">🏠</span>홈</button><button data-tab="dates"><span class="ni">💝</span>기념일</button><button data-tab="diary"><span class="ni">📸</span>사진 일기</button><button data-tab="schedule"><span class="ni">🗓️</span>일정</button><button data-tab="location"><span class="ni">📍</span>위치</button></nav></div>
<script>
const $=s=>document.querySelector(s);const get=(k,d)=>{try{return JSON.parse(localStorage.getItem('wr_'+k))??d}catch{return d}};const set=(k,v)=>localStorage.setItem('wr_'+k,JSON.stringify(v));let tab='home';const today=()=>new Date().toISOString().slice(0,10);const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'}):'';const diff=d=>Math.floor((new Date().setHours(0,0,0,0)-new Date(d+'T00:00:00').getTime())/86400000);function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function heading(t,sub=''){return `<div class="section-title">${t}<span class="muted">${sub}</span></div>`}function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const v=$('#view');if(tab==='home')v.innerHTML=home();if(tab==='dates')v.innerHTML=dates();if(tab==='diary')v.innerHTML=diary();if(tab==='schedule')v.innerHTML=schedule();if(tab==='location')v.innerHTML=locationPage()}
function home(){let start=get('start','');let n=start?Math.max(1,diff(start)+1):0;let ds=get('dates',[]).sort((a,b)=>a.date.localeCompare(b.date));let next=ds.map(x=>({...x,remain:Math.ceil((new Date(x.date+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000)})).filter(x=>x.remain>=0).sort((a,b)=>a.remain-b.remain)[0];let diarys=get('diary',[]);let events=get('events',[]).filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date));return `<section class="hero"><div class="eyebrow">우리의 소중한 하루</div><div class="days">${n?n+'<span>일째 함께</span>':'우리의 시작'} </div><div class="muted">${start?'처음 만난 날 · '+fmt(start):'우리의 시작 날짜를 등록해 봐 💌'}</div><div class="quote">오늘도 서로에게 다정하기 ☁️</div><div class="characters">🐻‍❄️ 💗 🐰</div><div style="margin-top:15px"><button class="btn light small" onclick="editStart()">${start?'시작 날짜 바꾸기':'시작 날짜 등록하기'}</button></div></section>${heading('다가오는 기념일','💗')}<div class="card">${next?`<div class="row"><div style="font-size:30px">💝</div><div class="grow"><b>${safe(next.name)}</b><div class="muted">${fmt(next.date)}</div></div><span class="pill">${next.remain===0?'오늘이야!':next.remain+'일 남음'}</span></div>`:`<div class="empty">기념일을 등록하고 함께 기다려 봐!</div>`}<button class="btn light small" onclick="go('dates')">기념일 보기 →</button></div>${heading('우리의 다음 약속','🗓️')}<div class="card">${events[0]?`<div class="row"><div style="font-size:28px">🌷</div><div class="grow"><b>${safe(events[0].title)}</b><div class="muted">${fmt(events[0].date)} ${safe(events[0].time||'')}</div></div></div>`:'<div class="empty">함께할 약속을 추가해 봐!</div>'}<button class="btn light small" onclick="go('schedule')">일정 보기 →</button></div>${heading('우리의 공간','')}<div class="grid"><button class="feature" onclick="go('diary')"><span class="emoji">📸</span><b>추억 모으기</b><span>사진과 오늘의 기록</span></button><button class="feature" onclick="go('location')"><span class="emoji">📍</span><b>내 위치 확인</b><span>원할 때만 위치 열기</span></button></div><div class="footer">🐻‍❄️ 우리만의 귀여운 기록장 🐰</div>`}
function dates(){let a=get('dates',[]);return `${heading('우리의 기념일','💝')}<div class="card"><label>기념일 이름</label><input class="field" id="dname" placeholder="예: 처음 만난 날, 100일"><label>날짜</label><input class="field" id="ddate" type="date" value="${today()}"><button class="btn" onclick="addDate()">+ 기념일 추가</button></div>${a.length?a.sort((x,y)=>x.date.localeCompare(y.date)).map((x,i)=>`<div class="card row"><div style="font-size:28px">${['💗','🎁','🌷','🧸'][i%4]}</div><div class="grow"><b>${safe(x.name)}</b><div class="muted">${fmt(x.date)}</div></div><span class="pill">${Math.ceil((new Date(x.date+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000)>=0?Math.ceil((new Date(x.date+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000)+'일 남음':Math.abs(Math.ceil((new Date(x.date+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000))+'일 지남'}</span><button class="btn light small" onclick="del('dates',${i})">삭제</button></div>`).join(''):'<div class="empty">첫 기념일을 등록해 봐 💌</div>'}<div class="notice">기념일은 이 아이폰에만 저장돼. 실제 알림은 아직 설정되지 않아.</div>`}
function diary(){let a=get('diary',[]);return `${heading('사진 일기','📸')}<div class="card"><label>오늘의 제목</label><input class="field" id="pname" placeholder="예: 같이 먹은 딸기 케이크"><label>날짜</label><input class="field" id="pdate" type="date" value="${today()}"><label>사진</label><input class="field" id="photo" type="file" accept="image/*"><label>우리의 이야기</label><textarea class="field" id="ptext" rows="3" placeholder="오늘 어떤 일이 있었어?"></textarea><button class="btn" onclick="addDiary()">💗 추억 저장하기</button></div>${a.length?a.slice().reverse().map((x,i)=>`<div class="card">${x.photo?`<img src="${x.photo}" style="width:100%;max-height:280px;object-fit:cover;border-radius:15px;margin-bottom:10px">`:''}<div class="muted">${fmt(x.date)}</div><b>${safe(x.name)}</b><p style="white-space:pre-wrap;font-size:14px">${safe(x.text)}</p><button class="btn light small" onclick="del('diary',${a.length-1-i})">삭제</button></div>`).join(''):'<div class="empty">첫 번째 추억을 사진과 함께 남겨 봐 🐰</div>'}<div class="notice">사진은 이 기기 브라우저 저장 공간에 저장돼. 중요한 사진은 별도로 백업해 줘.</div>`}
function schedule(){let a=get('events',[]);return `${heading('우리의 약속','🗓️')}<div class="card"><label>약속 이름</label><input class="field" id="etitle" placeholder="예: 영화 보고 저녁 먹기"><label>날짜</label><input class="field" id="edate" type="date" value="${today()}"><label>시간 (선택)</label><input class="field" id="etime" type="time"><label>장소 또는 메모 (선택)</label><input class="field" id="eplace" placeholder="예: 강남역, 영화관"><button class="btn" onclick="addEvent()">+ 약속 추가</button></div>${a.length?a.slice().sort((x,y)=>x.date.localeCompare(y.date)).map((x,i)=>`<div class="card row"><div style="font-size:27px">🌷</div><div class="grow"><b>${safe(x.title)}</b><div class="muted">${fmt(x.date)} ${safe(x.time||'')}</div><div class="muted">${safe(x.place||'')}</div></div><button class="btn light small" onclick="del('events',${i})">삭제</button></div>`).join(''):'<div class="empty">다음 데이트 계획을 세워 보자!</div>'}<div class="notice">현재 일정은 내 아이폰에만 저장돼. 여자친구와 자동 공유되지는 않아.</div>`}
function locationPage(){let loc=get('location',null);return `${heading('내 위치','📍')}<div class="mapbox"><div style="font-size:45px">🐻‍❄️ 💗 🐰</div><b>위치는 내가 원할 때만 확인해</b><div>현재 버전은 위치를 지도에 실시간 공유하지 않아.</div></div><div class="card" style="margin-top:12px"><p style="font-size:14px">아이폰 위치 권한을 허용하면 현재 좌표를 확인하고 이 기기에만 저장할 수 있어.</p><button class="btn" onclick="getLocation()">📍 내 현재 위치 확인</button>${loc?`<p><b>마지막 확인</b></p><div class="muted">${safe(loc.at)}</div><div class="muted">위도 ${loc.lat.toFixed(5)} · 경도 ${loc.lon.toFixed(5)}</div><p><a href="https://maps.apple.com/?ll=${loc.lat},${loc.lon}" target="_blank" rel="noopener">Apple 지도에서 열기 ↗</a></p><button class="btn light small" onclick="localStorage.removeItem('wr_location');render()">위치 기록 삭제</button>`:''}</div><div class="notice">위치 정보는 민감한 개인정보야. 이 버전은 서버로 전송하지 않고, 위치 공유나 추적을 백그라운드에서 하지 않아.</div>`}
function go(t){tab=t;render();window.scrollTo(0,0)}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));function editStart(){let old=get('start','');let d=prompt('처음 만난 날짜를 입력해 줘 (YYYY-MM-DD)',old||today());if(d&&/^\d{4}-\d\d-\d\d$/.test(d)){set('start',d);render()}}function addDate(){let name=$('#dname').value.trim(),date=$('#ddate').value;if(!name||!date)return alert('이름과 날짜를 입력해 줘!');let a=get('dates',[]);a.push({name,date});set('dates',a);render()}function addEvent(){let title=$('#etitle').value.trim(),date=$('#edate').value;if(!title||!date)return alert('약속 이름과 날짜를 입력해 줘!');let a=get('events',[]);a.push({title,date,time:$('#etime').value,place:$('#eplace').value.trim()});set('events',a);render()}async function addDiary(){let name=$('#pname').value.trim(),date=$('#pdate').value,text=$('#ptext').value.trim(),file=$('#photo').files[0];if(!name&&!text&&!file)return alert('제목, 이야기 또는 사진을 추가해 줘!');let photo='';if(file){if(file.size>4*1024*1024)return alert('사진은 4MB 이하로 선택해 줘.');photo=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}let a=get('diary',[]);a.push({name:name||'우리의 하루',date,text,photo});try{set('diary',a)}catch(e){return alert('저장 공간이 부족해. 사진을 줄이거나 오래된 기록을 삭제해 줘.')}render()}function del(k,i){if(confirm('이 기록을 삭제할까?')){let a=get(k,[]);a.splice(i,1);set(k,a);render()}}function getLocation(){if(!navigator.geolocation)return alert('이 브라우저에서는 위치 기능을 사용할 수 없어.');navigator.geolocation.getCurrentPosition(p=>{set('location',{lat:p.coords.latitude,lon:p.coords.longitude,at:new Date().toLocaleString('ko-KR')});render()},e=>alert('위치를 가져오지 못했어. 아이폰 설정에서 위치 권한을 확인해 줘.'),{enableHighAccuracy:false,timeout:10000})}if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
