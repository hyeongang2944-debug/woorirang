<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff0f3">
<title>우리랑 💗</title>
<style>
:root{--pink:#ff789b;--deep:#6e4554;--soft:#fff0f4;--line:#f4dbe2}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff2f5,#fffaf2 55%,#f4f8ff);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:var(--deep);padding-bottom:88px}.app{max-width:540px;margin:auto;min-height:100vh}.top{padding:22px 20px 14px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900}.brand small{font-size:12px;display:block;font-weight:500;color:#ad8290}.avatar{font-size:30px}.content{padding:0 16px}.hero,.card{background:#fffdfb;border:1px solid #fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 5px 18px #e7c6ce24}.hero{background:linear-gradient(135deg,#ffdce5,#fff0d7);min-height:160px}.eyebrow,.muted{font-size:12px;color:#ad8290}.days{font-size:34px;font-weight:900;margin:6px 0}.section-title{display:flex;justify-content:space-between;margin:22px 4px 12px;font-weight:900;font-size:17px}.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.btn{background:var(--pink);color:white;border:0;border-radius:13px;padding:11px 14px;font-weight:800;cursor:pointer}.btn.light{background:var(--soft);color:#ad617b}.btn.small{padding:7px 10px;font-size:12px}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fffafc;margin:6px 0 12px;font:inherit;color:var(--deep)}label{font-size:12px;font-weight:800}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);padding:10px 4px calc(10px + env(safe-area-inset-bottom));background:#ffffffed;display:flex;justify-content:space-around;border-top:1px solid #f6e2e7;z-index:5}.nav button{background:transparent;color:#b18b97;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px}.nav button .ni{font-size:20px}.nav button.active{color:#f36f94;font-weight:900}.empty{text-align:center;padding:18px 8px;color:#b28c99;font-size:13px}.notice{background:#f0f6ff;border-radius:14px;padding:12px;font-size:12px;line-height:1.6;color:#7184a2;margin:12px 0}.hide{display:none!important}textarea{resize:vertical}.entryimg{width:100%;max-height:280px;object-fit:cover;border-radius:14px}.status{font-size:12px;margin:8px 0;color:#7c6670}.error{color:#b42345}.success{color:#26734d}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">우리랑 💗<small>우리의 작은 행복을 모으는 곳</small></div><div class="avatar">🐻‍❄️ 💗 🐰</div></header>
<main class="content">
<section id="auth" class="card">
<h3>우리랑 로그인 💌</h3>
<p class="muted">두 사람이 각자 만든 Firebase 계정으로 로그인해 줘.</p>
<label>이메일</label><input id="email" class="field" type="email" autocomplete="username" placeholder="이메일">
<label>비밀번호</label><input id="password" class="field" type="password" autocomplete="current-password" placeholder="비밀번호">
<button class="btn" onclick="login()">로그인</button>
<div id="authStatus" class="status"></div>
</section>
<section id="main" class="hide">
<div class="row" style="justify-content:space-between;margin:8px 2px 14px"><span id="signedIn" class="muted"></span><button class="btn light small" onclick="logout()">로그아웃</button></div>
<div id="view"></div>
</section>
</main>
<nav id="nav" class="nav hide">
<button class="active" data-tab="home"><span class="ni">🏠</span>홈</button><button data-tab="dates"><span class="ni">💝</span>기념일</button><button data-tab="diary"><span class="ni">📸</span>사진 일기</button><button data-tab="schedule"><span class="ni">🗓️</span>일정</button><button data-tab="location"><span class="ni">📍</span>위치</button>
</nav>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// 1) 아래 네 값은 메모장에 있는 Firebase 웹 앱 설정값으로 바꿔 주세요.
const firebaseConfig = {
  apiKey: "AIzaSyA5DcYCWK_iE02h-P-a2mf9URTDS956Le4",
  authDomain: "woorirang-968e6.firebaseapp.com",
  projectId: "woorirang-968e6",
  appId: "1:716022833442:web:cb8bf8be591ef718f5c57b"
};
// 2) 아래 두 값을 각자의 Firebase Authentication UID로 바꿔 주세요.
const ALLOWED_UIDS = ["yzYKhjG5wXWX9U5IaI9mQgrFOrD2", "qwZwy89eMYUeL9MYeyPzLnUDSYW2"];
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const $ = s => document.querySelector(s);
let tab = "home", shared = {start:"",dates:[],diary:[],events:[],location:null}, docRef = db.collection("couples").doc("our-space"), unsubscribe = null, busy = false;
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?new Date(d+"T00:00:00").toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric"}):"";
const safe=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const heading=(t,sub="")=>`<div class="section-title">${t}<span class="muted">${sub}</span></div>`;
function status(msg, bad=false){$("#authStatus").textContent=msg;$("#authStatus").className="status "+(bad?"error":"success")}
function showApp(user){$("#auth").classList.add("hide");$("#main").classList.remove("hide");$("#nav").classList.remove("hide");$("#signedIn").textContent=user.email||"로그인됨"}
function showAuth(){ $("#auth").classList.remove("hide");$("#main").classList.add("hide");$("#nav").classList.add("hide"); if(unsubscribe){unsubscribe();unsubscribe=null} }
async function login(){const email=$("#email").value.trim(),password=$("#password").value;if(!email||!password)return status("이메일과 비밀번호를 입력해 줘.",true);try{status("로그인 중…");await auth.signInWithEmailAndPassword(email,password)}catch(e){status("로그인 실패: 이메일과 비밀번호를 확인해 줘. ("+e.code+")",true)}}
async function logout(){if(unsubscribe){unsubscribe();unsubscribe=null}await auth.signOut()}
auth.onAuthStateChanged(async user=>{
 if(!user){showAuth();return}
 if(!ALLOWED_UIDS.includes(user.uid)){await auth.signOut();showAuth();return status("이 계정은 우리랑 공유 멤버로 등록되어 있지 않아.",true)}
 showApp(user);
 if(unsubscribe)unsubscribe();
 unsubscribe=docRef.onSnapshot(snap=>{
   shared=snap.exists?snap.data():{start:"",dates:[],diary:[],events:[],location:null};
   render();
 },err=>{alert("공유 기록을 불러오지 못했어. Firestore 규칙을 확인해 줘. "+err.code)});
});
async function save(){if(busy)return;busy=true;try{await docRef.set({...shared,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){alert("저장 실패: Firestore 규칙 또는 연결을 확인해 줘. "+e.code)}finally{busy=false}}
function go(t){tab=t;render();window.scrollTo(0,0)}
$("#nav").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.tab)));
function render(){if(!auth.currentUser)return;$("#nav").querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));const v=$("#view");if(tab==="home")v.innerHTML=home();if(tab==="dates")v.innerHTML=dates();if(tab==="diary")v.innerHTML=diary();if(tab==="schedule")v.innerHTML=schedule();if(tab==="location")v.innerHTML=locationPage()}
function home(){let n=shared.start?Math.max(1,Math.floor((new Date(today()+"T00:00:00")-new Date(shared.start+"T00:00:00"))/86400000)+1):0;let next=(shared.dates||[]).map(x=>({...x,remain:Math.ceil((new Date(x.date+"T00:00:00")-new Date(today()+"T00:00:00"))/86400000)})).filter(x=>x.remain>=0).sort((a,b)=>a.remain-b.remain)[0];let event=(shared.events||[]).filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date))[0];return `<section class="hero"><div class="eyebrow">우리의 소중한 하루</div><div class="days">${n?n+"일째 함께":"우리의 시작"}</div><div class="muted">${shared.start?"처음 만난 날 · "+fmt(shared.start):"우리의 시작 날짜를 등록해 봐 💌"}</div><p>오늘도 서로에게 다정하기 ☁️</p><button class="btn light small" onclick="editStart()">${shared.start?"시작 날짜 바꾸기":"시작 날짜 등록하기"}</button></section>${heading("다가오는 기념일","💗")}<div class="card">${next?`<b>${safe(next.name)}</b><p class="muted">${fmt(next.date)} · ${next.remain===0?"오늘이야!":next.remain+"일 남음"}</p>`:"<div class='empty'>기념일을 등록해 봐!</div>"}<button class="btn light small" onclick="go('dates')">기념일 보기 →</button></div>${heading("우리의 다음 약속","🗓️")}<div class="card">${event?`<b>${safe(event.title)}</b><p class="muted">${fmt(event.date)} ${safe(event.time||"")} · ${safe(event.place||"")}</p>`:"<div class='empty'>함께할 약속을 추가해 봐!</div>"}<button class="btn light small" onclick="go('schedule')">일정 보기 →</button></div><div class="notice">이 기록은 로그인한 두 사람의 기기에서 함께 보여. 사진과 위치는 공유 전에 내용을 확인해 줘.</div>`}
function dates(){let a=shared.dates||[];return `${heading("우리의 기념일","💝")}<div class="card"><label>기념일 이름</label><input class="field" id="dname" placeholder="예: 처음 만난 날, 100일"><label>날짜</label><input class="field" id="ddate" type="date" value="${today()}"><button class="btn" onclick="addDate()">+ 기념일 추가</button></div>${a.slice().sort((x,y)=>x.date.localeCompare(y.date)).map((x,i)=>`<div class="card row"><div class="grow"><b>${safe(x.name)}</b><div class="muted">${fmt(x.date)}</div></div><button class="btn light small" onclick="delItem('dates',${a.indexOf(x)})">삭제</button></div>`).join("")||'<div class="empty">첫 기념일을 등록해 봐 💌</div>'}`}
async function addDate(){let name=$("#dname").value.trim(),date=$("#ddate").value;if(!name||!date)return alert("이름과 날짜를 입력해 줘!");shared.dates=[...(shared.dates||[]),{name,date,id:crypto.randomUUID()}];await save()}
function diary(){let a=shared.diary||[];return `${heading("사진 일기","📸")}<div class="card"><label>오늘의 제목</label><input class="field" id="pname" placeholder="예: 같이 먹은 딸기 케이크"><label>날짜</label><input class="field" id="pdate" type="date" value="${today()}"><label>사진 (선택, 500KB 이하 권장)</label><input class="field" id="photo" type="file" accept="image/*"><label>우리의 이야기</label><textarea class="field" id="ptext" rows="3" placeholder="오늘 어떤 일이 있었어?"></textarea><button class="btn" onclick="addDiary()">💗 추억 저장하기</button><div class="muted">사진을 포함한 기록이 커지면 저장에 실패할 수 있어.</div></div>${a.slice().reverse().map(x=>`<div class="card">${x.photo?`<img class="entryimg" src="${x.photo}" alt="추억 사진">`:""}<div class="muted">${fmt(x.date)}</div><b>${safe(x.name)}</b><p style="white-space:pre-wrap;font-size:14px">${safe(x.text)}</p><button class="btn light small" onclick="delItem('diary',${a.indexOf(x)})">삭제</button></div>`).join("")||'<div class="empty">첫 추억을 남겨 봐 🐰</div>'}`}
async function addDiary(){let name=$("#pname").value.trim(),date=$("#pdate").value,text=$("#ptext").value.trim(),file=$("#photo").files[0];if(!name&&!text&&!file)return alert("제목, 이야기 또는 사진을 추가해 줘!");let photo="";if(file){if(file.size>500*1024)return alert("지금은 사진 파일을 500KB 이하로 줄여서 선택해 줘.");photo=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}shared.diary=[...(shared.diary||[]),{name:name||"우리의 하루",date,text,photo,id:crypto.randomUUID()}];await save()}
function schedule(){let a=shared.events||[];return `${heading("우리의 약속","🗓️")}<div class="card"><label>약속 이름</label><input class="field" id="etitle" placeholder="예: 영화 보고 저녁 먹기"><label>날짜</label><input class="field" id="edate" type="date" value="${today()}"><label>시간 (선택)</label><input class="field" id="etime" type="time"><label>장소 또는 메모 (선택)</label><input class="field" id="eplace" placeholder="예: 강남역, 영화관"><button class="btn" onclick="addEvent()">+ 약속 추가</button></div>${a.slice().sort((x,y)=>x.date.localeCompare(y.date)).map(x=>`<div class="card row"><div class="grow"><b>${safe(x.title)}</b><div class="muted">${fmt(x.date)} ${safe(x.time||"")}</div><div class="muted">${safe(x.place||"")}</div></div><button class="btn light small" onclick="delItem('events',${a.indexOf(x)})">삭제</button></div>`).join("")||'<div class="empty">다음 데이트 계획을 세워 보자!</div>'}`}
async function addEvent(){let title=$("#etitle").value.trim(),date=$("#edate").value;if(!title||!date)return alert("약속 이름과 날짜를 입력해 줘!");shared.events=[...(shared.events||[]),{title,date,time:$("#etime").value,place:$("#eplace").value.trim(),id:crypto.randomUUID()}];await save()}
function locationPage(){let loc=shared.location;return `${heading("위치","📍")}<div class="card"><p>위치는 자동 추적하지 않아. 아래 버튼을 눌렀을 때만 현재 위치를 가져와 두 사람과 공유해.</p><button class="btn" onclick="shareLocation()">📍 현재 위치 공유하기</button>${loc?`<p class="muted">마지막 공유: ${safe(loc.at)}</p><p><a href="https://maps.apple.com/?ll=${loc.lat},${loc.lon}" target="_blank" rel="noopener">공유 위치를 Apple 지도에서 열기 ↗</a></p><button class="btn light small" onclick="clearLocation()">공유 위치 삭제</button>`:""}</div><div class="notice">위치 공유는 민감한 정보야. 버튼을 눌렀을 때만 공유하고, 필요 없어지면 삭제해 줘.</div>`}
function shareLocation(){if(!navigator.geolocation)return alert("이 브라우저에서는 위치 기능을 사용할 수 없어.");navigator.geolocation.getCurrentPosition(async p=>{shared.location={lat:p.coords.latitude,lon:p.coords.longitude,at:new Date().toLocaleString("ko-KR")};await save()},()=>alert("위치를 가져오지 못했어. 브라우저 위치 권한을 확인해 줘."),{enableHighAccuracy:false,timeout:10000})}
async function clearLocation(){if(confirm("두 사람에게 보이는 위치 기록을 삭제할까?")){shared.location=null;await save()}}
function editStart(){let d=prompt("처음 만난 날짜를 입력해 줘 (YYYY-MM-DD)",shared.start||today());if(d&&/^\d{4}-\d\d-\d\d$/.test(d)){shared.start=d;save()}}
async function delItem(k,i){if(confirm("이 기록을 두 사람의 공간에서 삭제할까?")){shared[k]=[...(shared[k]||[])];shared[k].splice(i,1);await save()}}
</script>
</body>
</html>
